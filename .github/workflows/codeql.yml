name: CodeQL

# PR branches are exercised by `pull_request`; the `push` trigger
# stays scoped to the long-lived branches (`main`, `dev`) and the weekly
# schedule so a push to a feature branch does not fire two parallel
# CodeQL analyses on the same commit — CodeQL TS analysis is the slowest
# workflow in the repo and the duplicate was the dominant queue cost.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
