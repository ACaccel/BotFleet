name: CI

on:
  # PR branches are exercised by `pull_request`; the `push` trigger
  # stays scoped to the long-lived branches (`main`, `dev`) so a push to
  # a feature branch does not fire both events back-to-back (the
  # duplicate doubled CI cost without adding any signal — the PR run
  # already covers the same commit).
  pull_request:
  push:
    branches:
      - main
      - dev

# Least privilege by default: no job here writes to the repository.
# A job that genuinely needs more must widen it at the job level.
permissions:
  contents: read

# One in-flight run per ref. Pushing a follow-up commit cancels the
# superseded run instead of paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - run: npm run lint
      - run: npm run format:check
      - run: npm run handlers:gen:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      # `tsconfig.strict.json` includes the whole `src/` tree, so
      # `npm run typecheck` compiles `src/bot/<name>/index.ts`, which
      # `import`s the gitignored per-bot `config.json`. Seed it so type
      # resolution succeeds — same reason as `typecheck-emit`.
      - uses: ./.github/actions/seed-bot-config
      - run: npm run typecheck

  test-coverage:
    # `npm run test:coverage` is `vitest run --coverage`, which runs every
    # project — unit, integration, integration-nodb, contract, i18n and
    # tools. It is therefore the single job that executes the whole
    # suite; separate `test-unit` / `test-tools` jobs only re-ran a
    # subset of it. The dedicated `test-int` / `test-contract` jobs
    # below stay because they carry the empty-project guard, which this
    # job cannot express.
    #
    # Coverage floors (`src/core/**` ≥ 90%, overall ≥ baseline) live in
    # vitest.config.ts; this job is the gate that enforces them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - run: npm run test:coverage

  test-int:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      # Run integration tests with JSON reporter so the next step can
      # verify the project actually loaded files (no silent green).
      # `test:int` does not pass `--passWithNoTests`, so vitest itself
      # exits nonzero on a glob mismatch; the JSON guard below is
      # defense-in-depth for the case where suites load but every test
      # inside them is skipped.
      - name: Run integration tests
        run: npm run test:int -- --reporter=json --outputFile=.vitest-int.json
      # Empty-project guard: a zero-suite run means the vitest project
      # glob is broken — fail the build.
      - name: Empty-project guard
        run: |
          set -euo pipefail
          if [ -f .vitest-int.json ]; then
            suites="$(jq '.numTotalTestSuites // 0' .vitest-int.json)"
          else
            suites=0
          fi
          echo "::notice::numTotalTestSuites=$suites"
          if [ "$suites" -gt 0 ]; then
            echo "Integration test suites present; guard satisfied."
            exit 0
          fi
          echo "::error::Expected at least one integration test suite, but vitest reported 0."
          exit 1

  test-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - name: Run contract tests
        run: npm run test:contract -- --reporter=json --outputFile=.vitest-contract.json
      # Empty-project guard: a zero-suite run means the vitest project
      # glob is broken — fail the build.
      - name: Empty-project guard
        run: |
          set -euo pipefail
          if [ -f .vitest-contract.json ]; then
            suites="$(jq '.numTotalTestSuites // 0' .vitest-contract.json)"
          else
            suites=0
          fi
          echo "::notice::numTotalTestSuites=$suites (contract)"
          if [ "$suites" -gt 0 ]; then exit 0; fi
          echo "::error::Expected at least one contract test suite, but vitest reported 0."
          exit 1

  knip:
    # Detects unused files, dependencies, exports and types. The
    # `knip.json` rules table errors on all of them except
    # `classMembers`, which stays at `warn`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - run: npm run knip

  typecheck-emit:
    # Confirm `tsc -p tsconfig.build.json` actually compiles outside
    # the strict-tsconfig include scope. `npm run
    # typecheck` runs noEmit on the strict project; this job runs the
    # whole src/ tree through emit-mode tsc so a broken `import`
    # outside the strict scope is caught at PR time, not runtime.
    #
    # NOTE: this is NOT a deploy build. Runtime is `ts-node` from
    # source (see `npm run nijika` etc. in package.json). The emitted
    # `dist/` retains TS path aliases (`require("@utils")`) and does
    # not bundle non-TS assets (config.json / locale JSON), so
    # invoking `node dist/...` would fail. The only signal this job
    # carries is whether tsc emits cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - uses: ./.github/actions/seed-bot-config
      - run: npm run typecheck:emit

  security:
    runs-on: ubuntu-latest
    # The only job that needs more than the workflow-level `contents:
    # read`: gitleaks annotates the pull request with what it found.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history
      - uses: ./.github/actions/npm-install
      - name: audit-ci (HIGH+ with documented allowlist)
        # `pipefail` is what makes this a gate: without it the step's exit
        # status is `tee`'s (always 0) and a HIGH+ advisory would pass.
        shell: bash
        run: |
          set -euo pipefail
          npm run security -- --output-format=json | tee audit-ci-report.json
      - name: Archive audit report + allowlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-ci-report-${{ github.run_id }}
          path: |
            audit-ci-report.json
            audit-ci.jsonc
          retention-days: 90
      - name: gitleaks
        # Pinned to a commit SHA, not the moving `v2` tag: a secret
        # scanner runs with repository contents in scope, so an
        # upstream tag repoint must not change what executes here.
        # Bump deliberately alongside the version comment.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
