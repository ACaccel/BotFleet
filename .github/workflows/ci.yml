name: CI

on:
  # PR branches are exercised by `pull_request`; the `push` trigger
  # stays scoped to the long-lived branches (`main`, `dev`) so a push to
  # a feature branch does not fire both events back-to-back (the
  # duplicate doubled CI cost without adding any signal — the PR run
  # already covers the same commit).
  pull_request:
  push:
    branches:
      - main
      - dev

# Least privilege by default: no job here writes to the repository.
# A job that genuinely needs more must widen it at the job level.
permissions:
  contents: read

# One in-flight run per ref. Pushing a follow-up commit cancels the
# superseded run instead of paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned to the deployment host's Ubuntu release rather than
# `ubuntu-latest`, so a runner image migration is a deliberate change.
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/npm-install
      # TypeScript imports gitignored per-bot config.json files. Seed
      # placeholder copies for both noEmit and emit-mode checks.
      - uses: ./.github/actions/seed-bot-config
      - run: npm run lint
      - run: npm run format:check
      - run: npm run handlers:gen:check
      - run: npm run typecheck
      - run: npm run typecheck:emit
      - run: npm run knip

  tests:
    # Coverage runs all six projects once and enforces the thresholds in
    # vitest.config.ts. The same run records per-project test counts,
    # because Vitest can succeed when one project silently contains no
    # tests; a separate `vitest list` pass would collect every file twice.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/npm-install
      - uses: ./.github/actions/seed-bot-config
      - name: Run coverage and record per-project test counts
        shell: bash
        run: |
          npm run test:coverage -- --reporter=default \
            --reporter=./scripts/vitest-project-counts.ts \
            --outputFile.project-counts="$RUNNER_TEMP/project-counts.json"
      - name: Require tests in every Vitest project
        shell: bash
        run: |
          set -euo pipefail
          jq -e '
            . as $counts
            | ["unit", "integration", "integration-nodb", "contract", "i18n", "tools"]
            | map(select(($counts[.] // 0) == 0))
            | if length == 0 then "All six Vitest projects contain tests."
              else error("Empty Vitest projects: \(join(", "))") end
          ' "$RUNNER_TEMP/project-counts.json"

  migration-drill:
    # The MongoDB migration drill skips itself unless
    # MIGRATION_TEST_BIN_DIR names real database binaries, so `tests`
    # never executes it. This job provisions the pinned runtime and
    # fails when the drill is skipped rather than run.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/npm-install
      - name: Provision the pinned MongoDB runtime
        shell: bash
        run: CONDA_EXE="$CONDA/bin/conda" bash scripts/setup-mongo.sh "$RUNNER_TEMP/mongodb"
      - name: Run the migration drill and require it to execute
        shell: bash
        run: |
          set -euo pipefail
          export MIGRATION_TEST_BIN_DIR="$RUNNER_TEMP/mongodb/bin"
          # Appended so the database runtime's own node cannot shadow
          # the project runtime that npm-install put first on PATH.
          export PATH="$PATH:$MIGRATION_TEST_BIN_DIR"
          report="$RUNNER_TEMP/migration-drill.json"
          npm run test:tools -- tools/migration/mongo.integration.test.ts \
            --reporter=default --reporter=json --outputFile.json="$report"
          jq -e '
            if .numTotalTests > 0 and .numPassedTests == .numTotalTests
            then "Migration drill ran \(.numPassedTests) tests."
            else error("Migration drill did not run: \(.numPassedTests) of \(.numTotalTests) passed, \(.numPendingTests) skipped.")
            end
          ' "$report"

  security:
    runs-on: ubuntu-24.04
    # The only job that needs more than the workflow-level `contents:
    # read`: gitleaks annotates the pull request with what it found.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks needs full history
      - uses: ./.github/actions/npm-install
      - name: audit-ci (HIGH+ with documented allowlist)
        # `pipefail` is what makes this a gate: without it the step's exit
        # status is `tee`'s (always 0) and a HIGH+ advisory would pass.
        shell: bash
        run: |
          set -euo pipefail
          npm run security -- --output-format=json | tee audit-ci-report.json
      - name: Archive audit report + allowlist
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-ci-report-${{ github.run_id }}
          path: |
            audit-ci-report.json
            audit-ci.jsonc
          retention-days: 90
      - name: gitleaks
        # Pinned to a commit SHA, not the moving `v2` tag: a secret
        # scanner runs with repository contents in scope, so an
        # upstream tag repoint must not change what executes here.
        # Bump deliberately alongside the version comment.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
