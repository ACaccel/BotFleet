name: CI

on:
  # PR branches are exercised by `pull_request`; the `push` trigger
  # stays scoped to the long-lived branches (`main`, `dev`) so a push to
  # a feature branch does not fire both events back-to-back (the
  # duplicate doubled CI cost without adding any signal — the PR run
  # already covers the same commit).
  pull_request:
  push:
    branches:
      - main
      - dev

# Least privilege by default: no job here writes to the repository.
# A job that genuinely needs more must widen it at the job level.
permissions:
  contents: read

# One in-flight run per ref. Pushing a follow-up commit cancels the
# superseded run instead of paying for a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      # TypeScript imports gitignored per-bot config.json files. Seed
      # placeholder copies for both noEmit and emit-mode checks.
      - uses: ./.github/actions/seed-bot-config
      - run: npm run lint
      - run: npm run format:check
      - run: npm run handlers:gen:check
      - run: npm run typecheck
      - run: npm run typecheck:emit
      - run: npm run knip

  tests:
    # Coverage runs all six projects once and enforces the thresholds in
    # vitest.config.ts. Check discovery first because Vitest can succeed
    # when one project silently contains no tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/npm-install
      - name: Require tests in every Vitest project
        shell: bash
        run: |
          set -euo pipefail
          node scripts/runtime.mjs exec vitest list --json | jq -e '
            group_by(.projectName)
            | map({key: .[0].projectName, value: length})
            | from_entries
            | . as $counts
            | ["unit", "integration", "integration-nodb", "contract", "i18n", "tools"]
            | map(select(($counts[.] // 0) == 0))
            | if length == 0 then "All six Vitest projects contain tests."
              else error("Empty Vitest projects: \(join(", "))") end
          '
      - run: npm run test:coverage

  security:
    runs-on: ubuntu-latest
    # The only job that needs more than the workflow-level `contents:
    # read`: gitleaks annotates the pull request with what it found.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history
      - uses: ./.github/actions/npm-install
      - name: audit-ci (HIGH+ with documented allowlist)
        # `pipefail` is what makes this a gate: without it the step's exit
        # status is `tee`'s (always 0) and a HIGH+ advisory would pass.
        shell: bash
        run: |
          set -euo pipefail
          npm run security -- --output-format=json | tee audit-ci-report.json
      - name: Archive audit report + allowlist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-ci-report-${{ github.run_id }}
          path: |
            audit-ci-report.json
            audit-ci.jsonc
          retention-days: 90
      - name: gitleaks
        # Pinned to a commit SHA, not the moving `v2` tag: a secret
        # scanner runs with repository contents in scope, so an
        # upstream tag repoint must not change what executes here.
        # Bump deliberately alongside the version comment.
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
